[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-it-ops-toolkit"
version = "0.1.0"
description = "Privacy-conscious automation primitives for ten AI-assisted IT operations workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Franco Mazziotti" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
mcp = ["mcp>=1.0"]

[project.scripts]
ai-it-ops = "ai_it_ops_toolkit.cli:main"
ai-it-ops-mcp = "ai_it_ops_toolkit.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_it_ops_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
